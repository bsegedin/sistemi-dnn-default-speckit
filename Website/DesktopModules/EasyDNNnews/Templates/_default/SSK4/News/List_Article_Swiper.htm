               [EasyDNNnews:IfExists:SubTitle]

<script type="text/javascript"
   src="/DesktopModules/EasyDNNnews/Templates/_default/SSK4/dist/swiper/swiper-bundle.min.js"></script>
<link rel="stylesheet" type="text/css"
   href="/DesktopModules/EasyDNNnews/Templates/_default/SSK4/dist/swiper/swiper-bundle.min.css">
<script type="text/javascript" src="/DesktopModules/EasyDNNnews/Templates/_default/SSK4/js/edn-helpers.js"></script>

<script>
   document.addEventListener("DOMContentLoaded", function () {
      const moduleId = '[EasyDNNnews:ModuleID]';
      renderSwiperArticle(moduleId);

      var swiper = new Swiper(".swiper-stage-" + moduleId, {
         loop: true,
         slidesPerView: 2,
         spaceBetween: 10,
         navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
         },
         on: {
            init: function () {
               equalizeSlideHeights();
            },
            resize: function () {
               equalizeSlideHeights();
            }
         },
         breakpoints: {
            992: {
               slidesPerView: 3
            },
            1200: {
               slidesPerView: 4,
            }
         }
      });

      // Equalize all slide heights to the tallest one
      function equalizeSlideHeights() {
         const slides = document.querySelectorAll(".swiper-stage-" + moduleId + " .swiper-slide");
         let maxHeight = 0;

         // Reset and measure
         slides.forEach(slide => {
            slide.style.height = "auto";
            const height = slide.offsetHeight;
            if (height > maxHeight) {
               maxHeight = height;
            }
         });

         // Apply max height to all
         slides.forEach(slide => {
            slide.style.height = maxHeight + "px";
         });
      }

      // Re-equalize after all lazy images load
      document.addEventListener("lazyloaded", function () {
         equalizeSlideHeights();
      });
   });
</script>



<!--RepeatEnd:After:-->
