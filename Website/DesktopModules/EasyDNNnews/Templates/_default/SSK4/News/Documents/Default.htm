<!--HeaderTemplate-->
<div class="c-documents-list c-documents-list--dnnnews">
  <h3 class='c-documents-list__title'>[EasyDNNnewsLocalizedText:DocumentsListTitle.Text]</h3>
  <ul class="c-documents-list__list">

    <!--HeaderEnd-->

    <!--TemplateDocument-->

    <li class="l-file">
      <div class="c-documents-list__item">
        <div class="c-link">
          <div class="c-icon c-documents-list__item-icon c-icon--[EasyDNNnews:Document:Type]"
            data-type="[EasyDNNnews:Document:Type]">
            <i class="o-icon doc-ico-txt doc-ico-[EasyDNNnews:Document:Type]"></i>
            <div class="c-documents-list__item-icon--type c-icon__type">[EasyDNNnews:Document:Type]</div>
          </div>
        </div>

        <div class="c-title">
          <a href="[EasyDNNnews:Document:Link]" title="[EasyDNNnews:Document:Title]" target="_blank">
            <div class="c-documents-list__item-title o-title ">[EasyDNNnews:Document:Title]</div>
          </a>
          <dl class="c-description">
            <dt class="c-description__item o-date">[EasyDNNnews:Document:DateUploaded]</dt>
            <dt class="c-description__item o-size">[EasyDNNnews:Document:FileSize]</dt>
            <dt class="c-description__item o-description">[EasyDNNnews:Document:Description]</dt>
          </dl>
        </div>
      </div>
    </li>
    <!--TemplateDocumentEnd-->

    <!--FooterTemplate-->
  </ul>
</div>
<!--FooterEnd-->
