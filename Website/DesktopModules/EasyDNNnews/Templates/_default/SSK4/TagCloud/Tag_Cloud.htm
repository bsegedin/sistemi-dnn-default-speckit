<!--HeaderBegin-->
<section class="edn-widget edn-widget--tags">
  <div class="edn-widget__title">
    <h3 id="edtagsHeader" class="edn_module_title o-title"><span>[EasyDNNtags:Title]</span></h3>
  </div>
<!--HeaderEnd-->

<!--BodyBegin-->
<div class="edn-widget__content">
	<div class="boxtagslist">
		<div id="TagCloudDiv" class="tags">
			<!--TagItemBegin-->
			<a class="[EasyDNNtags:TagClass] c-link" href="[EasyDNNtags:Link]">
        <div class="o-label">[EasyDNNtags:TagName]</div>
        [EasyDNNtags:IfExists:TagCount]
          <span class="tag-count o-value">[EasyDNNtags:TagCount]</span>
        [EasyDNNtags:EndIf:TagCount]
      </a>
			<!--TagItemEnd-->
		</div>
	</div>
</div>
<!--BodyEnd-->

<!--FooterBegin-->
</section>
<!--FooterEnd-->
